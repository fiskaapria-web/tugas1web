<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<p id="demo"></p>

<script>
let x = 5;
let y = 2;
let z = x + y;
document.getElementById("demo").innerHTML = z; 

let tugas = 30;
let absen = 20;
let kuis = 7;
let uts = 20;
let uas = 35;

let totalNilai = tugas + absen + kuis + uts + uas;

let rataRata = totalNilai / 5;

document.write("Nilai Tugas = " + tugas + "<br>");
document.write("Nilai Absen = " + absen + "<br>");
document.write("Nilai Kuis = " + kuis + "<br>");
document.write("Nilai UTS = " + uts + "<br>");
document.write("Nilai UAS = " + uas + "<br>");
document.write("Nilai Nilai = " + totalNilai + "<br>");
document.write("Nilai Rata-rata = " + rataRata + "<br>");

</script>

</body>
</html>
